services:
  - type: web
    name: dental-ai-voice-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PORT
        value: 10000
      - key: DENTAL_CRM_BASE_URL
        sync: false
      - key: DENTAL_CRM_API_KEY
        sync: false
      - key: DENTAL_CRM_ENABLED
        value: "true"
      - key: DENTAL_CRM_TIMEOUT_SECONDS
        value: "5.0"
